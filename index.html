<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoWeb</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html">RestoWeb</a></div>
        <div class="auth-buttons">
            <div><a href="connection.html">Connection</a></div>
            <div><a href="inscription.html">Inscription</a></div>
        </div>
    </nav>

    <section class="sectionArticle" id="sectionArticle">
        <div class="areaArticle">
            <div class="article">
                <img src="image/pizza.jpg" alt="pizza">
                <h2>Pizza Margherita</h2>
                <h3>15€</h3>
            </div>
            <div class="article">
                <img src="image/pizza.jpg" alt="pizza">
                <h2>Pizza Pepperoni</h2>
                <h3>18€</h3>
            </div>
            <div class="article">
                <img src="image/pizza.jpg" alt="pizza">
                <h2>Pizza Quatre Fromages</h2>
                <h3>20€</h3>
            </div>
            <div class="article">
                <img src="image/pizza.jpg" alt="pizza">
                <h2>Pizza Végétarienne</h2>
                <h3>17€</h3>
            </div>
            <div class="article">
                <img src="image/pizza.jpg" alt="pizza">
                <h2>Pizza Hawaïenne</h2>
                <h3>19€</h3>
            </div>
            <div class="article">
                <img src="image/pizza.jpg" alt="pizza">
                <h2>Pizza Calzone</h2>
                <h3>22€</h3>
            </div>
        </div>
    </section>

    <div class="voir-article-overlay" id="voirArticleOverlay">
        <section class="voir-article">
            <div class="voir-article-img">
                <img src="image/pizza.jpg" alt="pizzamama">
            </div>
            <div class="voir-article-details">
                <h2 class="voir-article-nom">Nom Article</h2>
                <div class="voir-article-prix">Prix : 15€</div>
                <div class="voir-article-btns">
                    <input type="number" placeholder="0">
                    <button class="valider-btn" onclick="window.location.href='connection.html'"><p>Valider</p></button>
                    <button id="closeVoirArticle" class="retour-btn"><p>Retour</p></button>
                </div>
            </div>
        </section>
    </div>

    <script>
    // Ajouter un écouteur d'événement à chaque article pour ouvrir l'overlay
    document.querySelectorAll('.article').forEach(article => {
        article.addEventListener('click', function() {
            // Récupérer l'overlay de visualisation d'article
            const overlay = document.getElementById('voirArticleOverlay');
            
            // Extraire les informations de l'article cliqué
            const imgSrc = this.querySelector('img').src;
            const nom = this.querySelector('h2').textContent;
            const prix = this.querySelector('h3').textContent;

            // Mettre à jour le contenu de l'overlay avec les informations de l'article
            overlay.querySelector('.voir-article-img img').src = imgSrc;
            overlay.querySelector('.voir-article-nom').textContent = nom;
            overlay.querySelector('.voir-article-prix').textContent = 'Prix : ' + prix;
            
            // Afficher l'overlay
            overlay.style.display = 'flex';
        });
    });

    // Ajouter un écouteur d'événement au bouton "Retour" pour fermer l'overlay
    document.getElementById('closeVoirArticle').addEventListener('click', function() {
        // Masquer l'overlay
        document.getElementById('voirArticleOverlay').style.display = 'none';
    });
    </script>
</body>
</html>
